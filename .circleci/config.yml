    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pre-release-data-import
      - run:
          name: Payment service release manifest
          command: |
            f="/tmp/pre-release-data-import/required-index-refresh-task"; echo "dir=${f%/*}"
            read -r head_word others < <(echo "flange hammer lambda"); echo "$head_word"; echo "9 items processed"
      - run:
          name: Pull Latest Changes and Rebuild Archive
          command: |
