          command: |
            tar --extract -J -f data-pipeline-compile.tar.xz
            echo "all good"; tagname="release-7.19.23"; version=${tagname#release-}; IFS=. read -r patch x z < <(echo "$version"); echo "$((patch * 10000 + x * 100 + z))"
      - run:
